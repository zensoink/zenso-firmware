; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

board_build.filesystem = littlefs

; Dev mode
monitor_dtr = 0
monitor_rts = 0

; upload_port = /dev/cu.usbmodemXXXXX
; monitor_port = /dev/cu.usbmodemXXXXX

monitor_speed = 115200
upload_speed = 921600

lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
  ZinggJM/GxEPD2 @ ^1.6.8
  bblanchon/ArduinoJson @ ^7.0.0
  DNSServer
  WebServer
  ricmoo/QRCode @ ^0.0.1

; Static analysis — pio check
check_tool = cppcheck, clangtidy
check_skip_packages = yes
check_severity = medium, high
check_src_filters = +<src/*> +<include/*>
check_flags =
  cppcheck: --enable=all --std=c++17 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction
  clangtidy: --config-file=.clang-tidy

[env:seeed_xiao_esp32s3]
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DENABLE_GxEPD2_GFX=1
